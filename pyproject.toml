[project]
name = "sitzungsbeleg"
version = "0.3.4"
description = "Deterministic session ledger for Claude Code and Codex sessions -- numbers and rule IDs, never content."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.138.2",
    "pydantic==2.13.4",
    "uvicorn==0.49.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
