<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Agent Session Ledger banner">
  <title>Agent Session Ledger</title>
  <defs>
    <style>
      .title { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-weight: 700; }
      .tagline { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-weight: 400; }
      .chip-label { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-weight: 600; }
    </style>
  </defs>

  <rect width="1280" height="320" fill="#004F7C"/>

  <!-- subtle depth: darker band along the bottom -->
  <rect x="0" y="272" width="1280" height="48" fill="#00395a"/>

  <text x="66" y="140" class="title" font-size="58" fill="#FFFFFF">Agent Session Ledger</text>
  <text x="66" y="190" class="tagline" font-size="24" fill="#CFE1EC">The flight recorder for AI agents.</text>
  <text x="66" y="226" class="tagline" font-size="22" fill="#CFE1EC">It logs what happened. Never what was said.</text>

  <!-- source and provider chips: Claude + Codex feed the ledger, four chat providers -->
  <g class="chip-label" font-size="20">
    <rect x="860" y="58" width="130" height="40" rx="8" fill="#D97757"/>
    <text x="925" y="84" fill="#FFFFFF" text-anchor="middle">Claude</text>

    <rect x="860" y="110" width="130" height="40" rx="8" fill="#10A37F"/>
    <text x="925" y="136" fill="#FFFFFF" text-anchor="middle">Codex</text>

    <rect x="860" y="162" width="130" height="40" rx="8" fill="#455A64"/>
    <text x="925" y="188" fill="#FFFFFF" text-anchor="middle">Ollama</text>

    <rect x="1010" y="58" width="150" height="40" rx="8" fill="#7624F4"/>
    <text x="1085" y="84" fill="#FFFFFF" text-anchor="middle">OpenRouter</text>

    <rect x="1010" y="110" width="150" height="40" rx="8" fill="#1E88E5"/>
    <text x="1085" y="136" fill="#FFFFFF" text-anchor="middle">Requesty</text>
  </g>

  <text x="860" y="240" class="tagline" font-size="15" fill="#9FC1D6">four-eyes review, redacted by default</text>
</svg>
