<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Agent Session Ledger social preview">
  <title>Agent Session Ledger</title>
  <defs>
    <style>
      .title { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-weight: 700; }
      .tagline { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-weight: 400; }
      .chip-label { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-weight: 600; }
      .byline { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-weight: 600; letter-spacing: 0.08em; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#004F7C"/>

  <!-- bottom band carries the sender -->
  <rect x="0" y="548" width="1280" height="92" fill="#00395a"/>

  <text x="80" y="230" class="title" font-size="72" fill="#FFFFFF">Agent Session Ledger</text>
  <text x="80" y="300" class="tagline" font-size="32" fill="#CFE1EC">The flight recorder for AI agents.</text>
  <text x="80" y="348" class="tagline" font-size="28" fill="#CFE1EC">It logs what happened. Never what was said.</text>

  <!-- source and provider chips -->
  <g class="chip-label" font-size="22">
    <rect x="80" y="420" width="140" height="44" rx="8" fill="#D97757"/>
    <text x="150" y="449" fill="#FFFFFF" text-anchor="middle">Claude</text>

    <rect x="236" y="420" width="140" height="44" rx="8" fill="#10A37F"/>
    <text x="306" y="449" fill="#FFFFFF" text-anchor="middle">Codex</text>

    <rect x="392" y="420" width="140" height="44" rx="8" fill="#455A64"/>
    <text x="462" y="449" fill="#FFFFFF" text-anchor="middle">Ollama</text>

    <rect x="548" y="420" width="160" height="44" rx="8" fill="#7624F4"/>
    <text x="628" y="449" fill="#FFFFFF" text-anchor="middle">OpenRouter</text>

    <rect x="724" y="420" width="150" height="44" rx="8" fill="#1E88E5"/>
    <text x="799" y="449" fill="#FFFFFF" text-anchor="middle">Requesty</text>
  </g>

  <text x="80" y="505" class="tagline" font-size="20" fill="#9FC1D6">four-eyes review, redacted by default, MIT licensed</text>

  <!-- sender -->
  <text x="80" y="604" class="byline" font-size="26" fill="#FFFFFF">VISCONSULT</text>
  <text x="1200" y="604" class="tagline" font-size="22" fill="#CFE1EC" text-anchor="end">vis-consult.eu</text>
</svg>
